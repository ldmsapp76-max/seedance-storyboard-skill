<rect width="1080" height="1920" fill="#f3eee6"/>
<text x="54" y="54" class="page-title">第6集导演草图页 5 / 6</text>
<g transform="translate(54,94)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-17｜谢大人来了｜6秒</text>
<image href="../panels/ep6_panel_6-17.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 74 292 L 34 78 L 162 78 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="74" y1="292" x2="98" y2="120" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="56,306 92,306 74,270" fill="#356d9b"/><text x="74" y="330" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">门口方向 / FOV</text><circle cx="150" cy="176" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="150" y="218" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="235" cy="210" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="235" y="252" text-anchor="middle" class="svg-name">青枝</text><circle cx="82" cy="108" r="22" fill="#9a7a57" stroke="#252525" stroke-width="2"/><text x="82" y="150" text-anchor="middle" class="svg-name">苏管家</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 苏府管家正面，苏明舒在前景侧边</text>
<text x="520" y="158" class="page-text">轻微推近管家汇报</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏府管家躬身急报，苏府管家：老爷，夫人，锦衣卫指</text><text x="520" y="262" class="page-text">挥使谢大人来了。苏明舒听见“谢大人”，动作一顿。</text>
</g><g transform="translate(54,552)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-18｜火候吐槽｜5秒</text>
<image href="../panels/ep6_panel_6-18.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 150 306 L 91 136 L 219 136 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="150" y1="306" x2="155" y2="178" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="132,320 168,320 150,284" fill="#356d9b"/><text x="150" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">苏明舒侧 / FOV</text><circle cx="150" cy="176" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="150" y="218" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="235" cy="210" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="235" y="252" text-anchor="middle" class="svg-name">青枝</text><circle cx="82" cy="108" r="22" fill="#9a7a57" stroke="#252525" stroke-width="2"/><text x="82" y="150" text-anchor="middle" class="svg-name">苏管家</text><rect x="147" y="196" width="26" height="20" rx="4" fill="#9fc7ba" stroke="#252525" stroke-width="2"/><text x="160" y="238" text-anchor="middle" class="svg-name">茶盏</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 苏明舒正面，茶盏在手边</text>
<text x="520" y="158" class="page-text">缓慢推近苏明舒错愕表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒愣了一下，随即压低声音吐槽，苏明舒：他来做</text><text x="520" y="262" class="page-text">什么？不会真来尝火候吧？青枝也跟着紧张看向门外。</text>
</g><g transform="translate(54,1010)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-19｜谢临舟登门｜5秒</text>
<image href="../panels/ep6_panel_6-19.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅求娶 / 主轴线</text><path d="M 180 314 L 118 70 L 246 70 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="180" y1="314" x2="182" y2="112" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="162,328 198,328 180,292" fill="#356d9b"/><text x="180" y="352" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">入场正面 / FOV</text><circle cx="182" cy="104" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="182" y="146" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="250" cy="132" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="250" y="174" text-anchor="middle" class="svg-name">石墩</text><rect x="249" y="155" width="26" height="20" rx="4" fill="#d9c79a" stroke="#252525" stroke-width="2"/><text x="262" y="197" text-anchor="middle" class="svg-name">礼单</text><circle cx="90" cy="164" r="22" fill="#8b6d50" stroke="#252525" stroke-width="2"/><text x="90" y="206" text-anchor="middle" class="svg-name">苏闻璟</text><circle cx="82" cy="224" r="22" fill="#b98a8e" stroke="#252525" stroke-width="2"/><text x="82" y="266" text-anchor="middle" class="svg-name">苏夫人</text><circle cx="230" cy="235" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="230" y="277" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="284" cy="260" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="284" y="302" text-anchor="middle" class="svg-name">青枝</text><path d="M 80 108 C 114 122, 146 138, 178 164" fill="none" stroke="#a75858" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr)"/></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">全景 / 苏府正厅门口正面，谢临舟从门外踏入，石墩跟在身后</text>
<text x="520" y="158" class="page-text">稳定器缓慢后退，迎接人物入场</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟踏入正厅，一身玄色常服，冷峻逼人，石墩跟在</text><text x="520" y="262" class="page-text">身后，手里捧着厚厚礼单。</text>
</g><g transform="translate(54,1468)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-20｜长辈问来意｜5秒</text>
<image href="../panels/ep6_panel_6-20.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅求娶 / 主轴线</text><path d="M 82 310 L 84 126 L 212 126 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="82" y1="310" x2="148" y2="168" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="64,324 100,324 82,288" fill="#356d9b"/><text x="82" y="348" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">长辈侧 / FOV</text><circle cx="182" cy="104" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="182" y="146" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="250" cy="132" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="250" y="174" text-anchor="middle" class="svg-name">石墩</text><rect x="249" y="155" width="26" height="20" rx="4" fill="#d9c79a" stroke="#252525" stroke-width="2"/><text x="262" y="197" text-anchor="middle" class="svg-name">礼单</text><circle cx="90" cy="164" r="22" fill="#8b6d50" stroke="#252525" stroke-width="2"/><text x="90" y="206" text-anchor="middle" class="svg-name">苏闻璟</text><circle cx="82" cy="224" r="22" fill="#b98a8e" stroke="#252525" stroke-width="2"/><text x="82" y="266" text-anchor="middle" class="svg-name">苏夫人</text><circle cx="230" cy="235" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="230" y="277" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="284" cy="260" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="284" y="302" text-anchor="middle" class="svg-name">青枝</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 苏闻璟侧前方，谢临舟在对面</text>
<text x="520" y="158" class="page-text">轻微推近苏闻璟起身动作</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏闻璟起身迎向谢临舟，苏闻璟：谢大人深夜登门，所</text><text x="520" y="262" class="page-text">为何事？</text>
</g>
</svg>