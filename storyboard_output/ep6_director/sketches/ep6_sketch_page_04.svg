<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img">
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker>
<style>
.page-title{font:800 26px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#1f1f1f}
.page-label{font:800 21px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#8a6538}
.page-text{font:600 20px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#2b2b2b}
.svg-name{font:700 14px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#222}
.svg-muted{font:700 13px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#6d655d}
.svg-cam{font:900 15px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#356d9b}
</style>
</defs>
<rect width="1080" height="1920" fill="#f3eee6"/>
<text x="54" y="54" class="page-title">第6集导演草图页 4 / 6</text>
<g transform="translate(54,94)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-13｜呛茶否认｜6秒</text>
<image href="../panels/ep6_panel_6-13.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 150 306 L 91 136 L 219 136 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="150" y1="306" x2="155" y2="178" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="132,320 168,320 150,284" fill="#356d9b"/><text x="150" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">苏明舒侧 / FOV</text><circle cx="150" cy="176" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="150" y="218" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="235" cy="210" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="235" y="252" text-anchor="middle" class="svg-name">青枝</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 苏明舒正面，茶盏在画面下方</text>
<text x="520" y="158" class="page-text">轻微推近苏明舒呛茶反应</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒差点呛到，立刻把茶盏放稳，苏明舒：谁想他？</text><text x="520" y="262" class="page-text">我是在想，什么机关能让人少说两句话。</text>
</g><g transform="translate(54,552)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-14｜长得挺好｜5秒</text>
<image href="../panels/ep6_panel_6-14.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 245 304 L 156 168 L 284 168 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="245" y1="304" x2="220" y2="210" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="227,318 263,318 245,282" fill="#356d9b"/><text x="245" y="342" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">青枝侧 / FOV</text><circle cx="150" cy="176" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="150" y="218" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="235" cy="210" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="235" y="252" text-anchor="middle" class="svg-name">青枝</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 青枝正面，苏明舒侧脸入画</text>
<text x="520" y="158" class="page-text">固定镜头，靠青枝表情完成笑点</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">青枝小声补一句，青枝：谢大人长得其实挺好。苏明舒</text><text x="520" y="262" class="page-text">慢慢抬眼看她，青枝立刻紧张起来。</text>
</g><g transform="translate(54,1010)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-15｜嘴确实不好｜4秒</text>
<image href="../panels/ep6_panel_6-15.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 150 306 L 91 136 L 219 136 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="150" y1="306" x2="155" y2="178" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="132,320 168,320 150,284" fill="#356d9b"/><text x="150" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">苏明舒侧 / FOV</text><circle cx="150" cy="176" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="150" y="218" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="235" cy="210" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="235" y="252" text-anchor="middle" class="svg-name">青枝</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 苏明舒正面平视，眼神轻轻压过去</text>
<text x="520" y="158" class="page-text">极慢推近苏明舒眼神</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒只是看了青枝一眼，青枝马上改口，青枝：但嘴</text><text x="520" y="262" class="page-text">确实不好。苏明舒满意地点了点头。</text>
</g><g transform="translate(54,1468)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-16｜急报入厅｜5秒</text>
<image href="../panels/ep6_panel_6-16.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 74 292 L 34 78 L 162 78 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="74" y1="292" x2="98" y2="120" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="56,306 92,306 74,270" fill="#356d9b"/><text x="74" y="330" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">门口方向 / FOV</text><circle cx="150" cy="176" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="150" y="218" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="235" cy="210" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="235" y="252" text-anchor="middle" class="svg-name">青枝</text><circle cx="82" cy="108" r="22" fill="#9a7a57" stroke="#252525" stroke-width="2"/><text x="82" y="150" text-anchor="middle" class="svg-name">苏管家</text><path d="M 80 108 C 114 122, 146 138, 178 164" fill="none" stroke="#a75858" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr)"/></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中景 / 正厅门口方向，苏府管家匆匆入画</text>
<text x="520" y="158" class="page-text">小幅横移跟随管家入厅</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">这时，苏府管家匆匆进来，脚步急促，苏明舒和青枝同</text><text x="520" y="262" class="page-text">时看向门口。</text>
</g>
</svg>