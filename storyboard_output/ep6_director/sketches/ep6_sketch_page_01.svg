<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img">
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker>
<style>
.page-title{font:800 26px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#1f1f1f}
.page-label{font:800 21px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#8a6538}
.page-text{font:600 20px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#2b2b2b}
.svg-name{font:700 14px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#222}
.svg-muted{font:700 13px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#6d655d}
.svg-cam{font:900 15px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#356d9b}
</style>
</defs>
<rect width="1080" height="1920" fill="#f3eee6"/>
<text x="54" y="54" class="page-title">第6集导演草图页 1 / 6</text>
<g transform="translate(54,94)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-1｜顾府夜议｜5秒</text>
<image href="../panels/ep6_panel_6-1.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ede6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">顾相府书房 / 主轴线</text><path d="M 180 312 L 116 106 L 244 106 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="180" y1="312" x2="180" y2="148" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="162,326 198,326 180,290" fill="#356d9b"/><text x="180" y="350" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">书房轴线 / FOV</text><circle cx="180" cy="112" r="22" fill="#6d5b4a" stroke="#252525" stroke-width="2"/><text x="180" y="154" text-anchor="middle" class="svg-name">顾仲山</text><circle cx="108" cy="214" r="22" fill="#c9a24a" stroke="#252525" stroke-width="2"/><text x="108" y="256" text-anchor="middle" class="svg-name">顾灵薇</text><circle cx="268" cy="172" r="22" fill="#7b7468" stroke="#252525" stroke-width="2"/><text x="268" y="214" text-anchor="middle" class="svg-name">顾管家</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">全景 / 顾相府书房正面，顾仲山居中坐于书案后，顾灵薇坐在侧位，管</text>
<text x="520" y="158" class="page-text">稳定器缓慢推进</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">顾相府书房夜色沉沉，顾灵薇坐在一旁，脸上还残留洗</text><text x="520" y="262" class="page-text">不净的金粉，顾仲山坐在书案后，神色沉稳。</text>
</g><g transform="translate(54,552)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-2｜灵薇告状｜5秒</text>
<image href="../panels/ep6_panel_6-2.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ede6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">顾相府书房 / 主轴线</text><path d="M 92 304 L 80 176 L 208 176 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="92" y1="304" x2="144" y2="218" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="74,318 110,318 92,282" fill="#356d9b"/><text x="92" y="342" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">灵薇侧 / FOV</text><circle cx="180" cy="112" r="22" fill="#6d5b4a" stroke="#252525" stroke-width="2"/><text x="180" y="154" text-anchor="middle" class="svg-name">顾仲山</text><circle cx="108" cy="214" r="22" fill="#c9a24a" stroke="#252525" stroke-width="2"/><text x="108" y="256" text-anchor="middle" class="svg-name">顾灵薇</text><circle cx="268" cy="172" r="22" fill="#7b7468" stroke="#252525" stroke-width="2"/><text x="268" y="214" text-anchor="middle" class="svg-name">顾管家</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 顾灵薇正面偏侧，脸上残粉清晰可见</text>
<text x="520" y="158" class="page-text">缓慢推近顾灵薇委屈怒意</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">顾灵薇忍了一路的委屈终于爆发，顾灵薇：父亲，苏明</text><text x="520" y="262" class="page-text">舒今日让我颜面尽失！</text>
</g><g transform="translate(54,1010)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-3｜父亲盘问｜6秒</text>
<image href="../panels/ep6_panel_6-3.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ede6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">顾相府书房 / 主轴线</text><path d="M 202 304 L 116 74 L 244 74 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="202" y1="304" x2="180" y2="116" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="184,318 220,318 202,282" fill="#356d9b"/><text x="202" y="342" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">书案正面 / FOV</text><circle cx="180" cy="112" r="22" fill="#6d5b4a" stroke="#252525" stroke-width="2"/><text x="180" y="154" text-anchor="middle" class="svg-name">顾仲山</text><circle cx="108" cy="214" r="22" fill="#c9a24a" stroke="#252525" stroke-width="2"/><text x="108" y="256" text-anchor="middle" class="svg-name">顾灵薇</text><circle cx="268" cy="172" r="22" fill="#7b7468" stroke="#252525" stroke-width="2"/><text x="268" y="214" text-anchor="middle" class="svg-name">顾管家</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 顾仲山正面平视，书案前景压出权势感</text>
<text x="520" y="158" class="page-text">极慢推近顾仲山眼神</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">顾仲山没有安慰她，只沉稳发问，顾仲山：今日天机匣</text><text x="520" y="262" class="page-text">择主，众人都看见了？顾灵薇压着不甘，顾灵薇：看见</text><text x="520" y="292" class="page-text">了。天机匣最后落在我脚边。</text>
</g><g transform="translate(54,1468)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-4｜那便够了｜3秒</text>
<image href="../panels/ep6_panel_6-4.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ede6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">顾相府书房 / 主轴线</text><path d="M 180 300 L 116 118 L 244 118 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="180" y1="300" x2="180" y2="160" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="162,314 198,314 180,278" fill="#356d9b"/><text x="180" y="338" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">手部特写 / FOV</text><circle cx="180" cy="112" r="22" fill="#6d5b4a" stroke="#252525" stroke-width="2"/><text x="180" y="154" text-anchor="middle" class="svg-name">顾仲山</text><circle cx="108" cy="214" r="22" fill="#c9a24a" stroke="#252525" stroke-width="2"/><text x="108" y="256" text-anchor="middle" class="svg-name">顾灵薇</text><circle cx="268" cy="172" r="22" fill="#7b7468" stroke="#252525" stroke-width="2"/><text x="268" y="214" text-anchor="middle" class="svg-name">顾管家</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">特写 / 顾仲山手指与书案特写</text>
<text x="520" y="158" class="page-text">微距慢推手部动作</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">顾仲山听到结果，神色这才稍缓，顾仲山：那便够了。</text>
</g>
</svg>