<text x="54" y="54" class="page-title">第6集导演草图页 6 / 6</text>
<g transform="translate(54,94)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-21｜突然求娶｜6秒</text>
<image href="../panels/ep6_panel_6-21.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅求娶 / 主轴线</text><path d="M 180 314 L 118 70 L 246 70 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="180" y1="314" x2="182" y2="112" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="162,328 198,328 180,292" fill="#356d9b"/><text x="180" y="352" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">入场正面 / FOV</text><circle cx="182" cy="104" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="182" y="146" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="250" cy="132" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="250" y="174" text-anchor="middle" class="svg-name">石墩</text><rect x="249" y="155" width="26" height="20" rx="4" fill="#d9c79a" stroke="#252525" stroke-width="2"/><text x="262" y="197" text-anchor="middle" class="svg-name">礼单</text><circle cx="90" cy="164" r="22" fill="#8b6d50" stroke="#252525" stroke-width="2"/><text x="90" y="206" text-anchor="middle" class="svg-name">苏闻璟</text><circle cx="82" cy="224" r="22" fill="#b98a8e" stroke="#252525" stroke-width="2"/><text x="82" y="266" text-anchor="middle" class="svg-name">苏夫人</text><circle cx="230" cy="235" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="230" y="277" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="284" cy="260" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="284" y="302" text-anchor="middle" class="svg-name">青枝</text><path d="M 182 104 C 194 148, 208 190, 230 235" fill="none" stroke="#a75858" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr)"/></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 谢临舟正面平视，苏府众人虚化在前景边缘</text>
<text x="520" y="158" class="page-text">缓慢推近谢临舟行礼</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟规矩行礼，神色平静，谢临舟：求娶苏大小姐。</text><text x="520" y="262" class="page-text">石墩低头捧着礼单，礼单厚得压手。</text>
</g><g transform="translate(54,552)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-22｜全家石化｜4秒</text>
<image href="../panels/ep6_panel_6-22.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅求娶 / 主轴线</text><path d="M 82 310 L 84 126 L 212 126 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="82" y1="310" x2="148" y2="168" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="64,324 100,324 82,288" fill="#356d9b"/><text x="82" y="348" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">长辈侧 / FOV</text><circle cx="182" cy="104" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="182" y="146" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="250" cy="132" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="250" y="174" text-anchor="middle" class="svg-name">石墩</text><rect x="249" y="155" width="26" height="20" rx="4" fill="#d9c79a" stroke="#252525" stroke-width="2"/><text x="262" y="197" text-anchor="middle" class="svg-name">礼单</text><circle cx="90" cy="164" r="22" fill="#8b6d50" stroke="#252525" stroke-width="2"/><text x="90" y="206" text-anchor="middle" class="svg-name">苏闻璟</text><circle cx="82" cy="224" r="22" fill="#b98a8e" stroke="#252525" stroke-width="2"/><text x="82" y="266" text-anchor="middle" class="svg-name">苏夫人</text><circle cx="230" cy="235" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="230" y="277" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="284" cy="260" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="284" y="302" text-anchor="middle" class="svg-name">青枝</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">群像中景 / 苏府众人正面反应，苏明舒在侧边，苏闻璟与苏夫人在主位附近</text>
<text x="520" y="158" class="page-text">定镜停顿三秒</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">全家石化三秒，厅内静得像被按住了声音。</text>
</g><g transform="translate(54,1010)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-23｜茶盏一抖｜4秒</text>
<image href="../panels/ep6_panel_6-23.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅求娶 / 主轴线</text><path d="M 190 306 L 114 142 L 242 142 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="190" y1="306" x2="178" y2="184" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="172,320 208,320 190,284" fill="#356d9b"/><text x="190" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">苏明舒反应 / FOV</text><circle cx="185" cy="178" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="185" y="220" text-anchor="middle" class="svg-name">苏明舒</text><rect x="163" y="200" width="26" height="20" rx="4" fill="#9fc7ba" stroke="#252525" stroke-width="2"/><text x="176" y="242" text-anchor="middle" class="svg-name">茶盏</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">特写 / 苏明舒手中茶盏特写，茶水一晃</text>
<text x="520" y="158" class="page-text">微距慢推茶盏抖动</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒手里的茶盏一抖，茶水差点洒出来。</text>
</g><g transform="translate(54,1468)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">6-24｜你说什么｜5秒</text>
<image href="../panels/ep6_panel_6-24.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#f1e8dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅求娶 / 主轴线</text><path d="M 190 306 L 114 142 L 242 142 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="190" y1="306" x2="178" y2="184" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="172,320 208,320 190,284" fill="#356d9b"/><text x="190" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">苏明舒反应 / FOV</text><circle cx="175" cy="180" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="175" y="222" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="245" cy="210" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="245" y="252" text-anchor="middle" class="svg-name">青枝</text><circle cx="86" cy="132" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="86" y="174" text-anchor="middle" class="svg-name">谢临舟</text><path d="M 182 104 C 194 148, 208 190, 230 235" fill="none" stroke="#a75858" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr)"/></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 苏明舒正面，谢临舟虚化在前景边缘</text>
<text x="520" y="158" class="page-text">缓慢推近苏明舒震惊表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒终于反应过来，睁大眼看着谢临舟，苏明舒：你</text><text x="520" y="262" class="page-text">说什么？谢临舟站在厅中央，神色平静得像只是说了一</text><text x="520" y="292" class="page-text">句寻常话。</text>
</g>
</svg>