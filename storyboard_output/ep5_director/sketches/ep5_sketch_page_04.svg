<text x="26" y="42" class="page-title">5-13｜俯身靠近｜7秒</text>
<image href="../panels/ep5_panel_5-13.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 182 312 L 118 130 L 246 130 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="182" y1="312" x2="182" y2="172" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="164,326 200,326 182,290" fill="#356d9b"/><text x="182" y="350" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">双人轴线 / FOV</text><circle cx="150" cy="188" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="150" y="230" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="202" cy="170" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="202" y="212" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="92" cy="230" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="92" y="272" text-anchor="middle" class="svg-name">青枝</text><circle cx="274" cy="198" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="274" y="240" text-anchor="middle" class="svg-name">石墩</text><path d="M 205 170 C 188 174, 168 180, 150 188" fill="none" stroke="#a75858" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr)"/></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 双人侧拍，谢临舟微微俯身靠近苏明舒</text>
<text x="520" y="158" class="page-text">缓慢推近两人距离变化</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟微微俯身，声音压低，谢临舟：苏小姐这么想看</text><text x="520" y="262" class="page-text">，婚后更合礼数。苏明舒眼神一顿。</text>
</g>
