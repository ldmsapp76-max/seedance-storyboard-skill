<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">特写 / 苏明舒脸部特写，耳尖泛红</text>
<text x="520" y="158" class="page-text">极慢推近苏明舒耳尖与表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒耳尖一红，立刻反驳，苏明舒：谁要婚后看？谢</text><text x="520" y="262" class="page-text">临舟低眼看她，谢临舟：你脸红什么？</text>
</g>
