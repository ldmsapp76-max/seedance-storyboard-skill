<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中景 / 回廊侧拍，谢临舟转身离开</text>
<text x="520" y="158" class="page-text">稳定器轻跟谢临舟转身动作</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟转身离开，苏明舒站在原地，脸上的红意还没完</text><text x="520" y="262" class="page-text">全退下。</text>
