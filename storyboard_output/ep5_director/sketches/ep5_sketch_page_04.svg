<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 双人正侧拍，苏明舒努力镇定，谢临舟微微垂眼</text>
<text x="520" y="158" class="page-text">固定镜头，靠台词节奏完成暧昧笑点</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒强作镇定，苏明舒：风吹的。谢临舟看了眼无风</text><text x="520" y="262" class="page-text">的回廊，谢临舟：嗯，风挺会挑人吹。</text>
</g>
