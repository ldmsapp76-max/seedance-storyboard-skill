<rect width="1080" height="1920" fill="#f3eee6"/>
<text x="54" y="54" class="page-title">第5集导演草图页 6 / 6</text>

<g transform="translate(54,94)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-21｜我等着｜4秒</text>
<image href="../panels/ep5_panel_5-21.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 280 282 L 161 98 L 289 98 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="280" y1="282" x2="225" y2="140" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="262,296 298,296 280,260" fill="#356d9b"/><text x="280" y="320" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">谢侧 / FOV</text><circle cx="128" cy="210" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="128" y="252" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="238" cy="98" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="238" y="140" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="78" cy="248" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="78" y="290" text-anchor="middle" class="svg-name">青枝</text><circle cx="284" cy="124" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="284" y="166" text-anchor="middle" class="svg-name">石墩</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 谢临舟侧前方，苏明舒在远处虚化</text>
<text x="520" y="158" class="page-text">轻微后拉，带出回廊纵深</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟看着她，语气平静，谢临舟：我等着。</text>
</g>
<g transform="translate(54,552)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-22｜锁灵玉微光｜5秒</text>
<image href="../panels/ep5_panel_5-22.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 185 300 L 154 112 L 282 112 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="185" y1="300" x2="218" y2="154" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="167,314 203,314 185,278" fill="#356d9b"/><text x="185" y="338" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">袖中特写 / FOV</text><circle cx="205" cy="120" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="205" y="162" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="278" cy="148" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="278" y="190" text-anchor="middle" class="svg-name">石墩</text><circle cx="220" cy="155" r="10" fill="#82c9c2" stroke="#2f6d6a" stroke-width="2"/><text x="220" y="182" text-anchor="middle" class="svg-name">锁灵玉</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">特写 / 谢临舟袖中手部特写，锁灵玉微光从袖内透出</text>
<text x="520" y="158" class="page-text">缓慢推近袖中微光</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">镜头切到谢临舟袖中，锁灵玉微微发光。</text>
</g>
<g transform="translate(54,1010)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-23｜小时候线索｜5秒</text>
<image href="../panels/ep5_panel_5-23.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 280 282 L 161 98 L 289 98 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="280" y1="282" x2="225" y2="140" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="262,296 298,296 280,260" fill="#356d9b"/><text x="280" y="320" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">谢侧 / FOV</text><circle cx="205" cy="120" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="205" y="162" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="278" cy="148" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="278" y="190" text-anchor="middle" class="svg-name">石墩</text><circle cx="220" cy="155" r="10" fill="#82c9c2" stroke="#2f6d6a" stroke-width="2"/><text x="220" y="182" text-anchor="middle" class="svg-name">锁灵玉</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 谢临舟侧脸特写，声音压低</text>
<text x="520" y="158" class="page-text">极慢推近谢临舟眼神</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟低声，谢临舟：脾气倒和小时候一样。</text>
</g>
<g transform="translate(54,1468)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-24｜回廊淡出｜6秒</text>
<image href="../panels/ep5_panel_5-24.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 74 292 L 141 113 L 269 113 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="74" y1="292" x2="205" y2="155" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="56,306 92,306 74,270" fill="#356d9b"/><text x="74" y="330" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">侧跟 / FOV</text><circle cx="110" cy="226" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="110" y="268" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="245" cy="80" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="245" y="122" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="66" cy="255" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="66" y="297" text-anchor="middle" class="svg-name">青枝</text><circle cx="292" cy="112" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="292" y="154" text-anchor="middle" class="svg-name">石墩</text><path d="M 238 98 C 250 78, 262 62, 280 48" fill="none" stroke="#a75858" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr)"/></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">全景 / 回廊纵深背后跟拍，谢临舟与石墩离开，苏明舒停在远处</text>
<text x="520" y="158" class="page-text">稳定器缓慢后拉后停住</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟和石墩走向回廊深处，苏明舒远远看着他的背影</text><text x="520" y="262" class="page-text">，若有所思。</text>
</g>
</svg>