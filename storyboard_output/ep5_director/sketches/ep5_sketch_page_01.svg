<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" role="img">
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker>
<style>
.page-title{font:800 26px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#1f1f1f}
.page-label{font:800 21px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#8a6538}
.page-text{font:600 20px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#2b2b2b}
.svg-name{font:700 14px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#222}
.svg-muted{font:700 13px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#6d655d}
.svg-cam{font:900 15px "Microsoft YaHei","Noto Sans SC",Arial,sans-serif;fill:#356d9b}
</style>
</defs>
<rect width="1080" height="1920" fill="#f3eee6"/>
<text x="54" y="54" class="page-title">第5集导演草图页 1 / 6</text>

<g transform="translate(54,94)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-1｜回廊相遇｜6秒</text>
<image href="../panels/ep5_panel_5-1.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 74 292 L 141 113 L 269 113 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="74" y1="292" x2="205" y2="155" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="56,306 92,306 74,270" fill="#356d9b"/><text x="74" y="330" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">侧跟 / FOV</text><circle cx="112" cy="210" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="112" y="252" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="235" cy="138" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="235" y="180" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="72" cy="248" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="72" y="290" text-anchor="middle" class="svg-name">青枝</text><circle cx="282" cy="120" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="282" y="162" text-anchor="middle" class="svg-name">石墩</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">全景 / 御花园回廊纵深正侧拍，苏明舒从花园方向走入，谢临舟站在回</text>
<text x="520" y="158" class="page-text">稳定器缓慢跟随苏明舒进入回廊</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒顺着那股熟悉气息走到御花园回廊，脚步不急不</text><text x="520" y="262" class="page-text">慢。谢临舟站在那里，像是早就等着她。</text>
</g>
<g transform="translate(54,552)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-2｜苏明舒打量｜5秒</text>
<image href="../panels/ep5_panel_5-2.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 130 306 L 86 146 L 214 146 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="130" y1="306" x2="150" y2="188" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="112,320 148,320 130,284" fill="#356d9b"/><text x="130" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">苏侧 / FOV</text><circle cx="132" cy="188" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="132" y="230" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="230" cy="160" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="230" y="202" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="82" cy="230" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="82" y="272" text-anchor="middle" class="svg-name">青枝</text><circle cx="282" cy="190" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="282" y="232" text-anchor="middle" class="svg-name">石墩</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 苏明舒侧前方，谢临舟在前方虚化</text>
<text x="520" y="158" class="page-text">轻微推近苏明舒打量动作</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒上下打量谢临舟，眼神从玄色衣襟扫到他冷淡的</text><text x="520" y="262" class="page-text">脸，苏明舒：你就是谢临舟？</text>
</g>
<g transform="translate(54,1010)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-3｜谢临舟反问｜4秒</text>
<image href="../panels/ep5_panel_5-3.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 280 282 L 161 98 L 289 98 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="280" y1="282" x2="225" y2="140" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="262,296 298,296 280,260" fill="#356d9b"/><text x="280" y="320" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">谢侧 / FOV</text><circle cx="132" cy="188" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="132" y="230" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="230" cy="160" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="230" y="202" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="82" cy="230" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="82" y="272" text-anchor="middle" class="svg-name">青枝</text><circle cx="282" cy="190" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="282" y="232" text-anchor="middle" class="svg-name">石墩</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 谢临舟正面平视，苏明舒肩部虚化在前景</text>
<text x="520" y="158" class="page-text">极慢推近谢临舟冷淡表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟神色不动，目光落在苏明舒脸上，谢临舟：你就</text><text x="520" y="262" class="page-text">是苏明舒？</text>
</g>
<g transform="translate(54,1468)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">5-4｜冷面互怼｜7秒</text>
<image href="../panels/ep5_panel_5-4.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#ebe5dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">御花园回廊纵深 / 外侧暖光 / 内侧冷光</text><line x1="70" y1="120" x2="300" y2="120" stroke="#b9afa3" stroke-width="3" stroke-dasharray="10 8"/><path d="M 182 312 L 118 130 L 246 130 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="182" y1="312" x2="182" y2="172" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="164,326 200,326 182,290" fill="#356d9b"/><text x="182" y="350" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="330" text-anchor="end" class="svg-muted">双人轴线 / FOV</text><circle cx="132" cy="188" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="132" y="230" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="230" cy="160" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="230" y="202" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="82" cy="230" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="82" y="272" text-anchor="middle" class="svg-name">青枝</text><circle cx="282" cy="190" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="282" y="232" text-anchor="middle" class="svg-name">石墩</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 双人侧拍，苏明舒与谢临舟形成对峙构图</text>
<text x="520" y="158" class="page-text">固定镜头，靠两人台词节奏推进</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒笑眯眯地开口，苏明舒：谢大人方才帮我说话，</text><text x="520" y="262" class="page-text">我是不是该道谢？谢临舟冷淡接住，谢临舟：不用。我</text><text x="520" y="292" class="page-text">不是帮你，只是看蠢货不顺眼。</text>
</g>
</svg>