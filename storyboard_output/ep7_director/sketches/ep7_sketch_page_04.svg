<text x="54" y="54" class="page-title">第7集导演分镜页 4 / 8</text>
<g transform="translate(54,94)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">7-13｜礼单展开｜5秒</text>
<image href="../panels/ep7_panel_7-13.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#efe8dd" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 190 306 L 126 138 L 254 138 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="190" y1="306" x2="190" y2="180" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="172,320 208,320 190,284" fill="#356d9b"/><text x="190" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">礼单低位 / FOV</text><circle cx="190" cy="138" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="190" y="180" text-anchor="middle" class="svg-name">石墩</text><rect x="177" y="185" width="26" height="20" rx="4" fill="#d9c79a" stroke="#252525" stroke-width="2"/><text x="190" y="227" text-anchor="middle" class="svg-name">礼单</text><circle cx="125" cy="116" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="125" y="158" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="250" cy="230" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="250" y="272" text-anchor="middle" class="svg-name">苏明舒</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中景 / 石墩侧前方，礼单从他手中展开</text>
<text x="520" y="158" class="page-text">低位跟随礼单向下展开</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">石墩展开礼单，礼单长得快拖到门口，厅里所有人的视</text><text x="520" y="262" class="page-text">线都顺着礼单往下移。</text>
</g><g transform="translate(54,552)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">7-14｜聘礼震惊｜7秒</text>
<image href="../panels/ep7_panel_7-14.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#efe8dd" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 118 306 L 68 118 L 196 118 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="118" y1="306" x2="132" y2="160" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="100,320 136,320 118,284" fill="#356d9b"/><text x="118" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">长辈侧 / FOV</text><circle cx="126" cy="158" r="22" fill="#8b6d50" stroke="#252525" stroke-width="2"/><text x="126" y="200" text-anchor="middle" class="svg-name">苏闻璟</text><circle cx="86" cy="220" r="22" fill="#b98a8e" stroke="#252525" stroke-width="2"/><text x="86" y="262" text-anchor="middle" class="svg-name">苏夫人</text><circle cx="238" cy="122" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="238" y="164" text-anchor="middle" class="svg-name">谢临舟</text><rect x="222" y="162" width="26" height="20" rx="4" fill="#d9c79a" stroke="#252525" stroke-width="2"/><text x="235" y="204" text-anchor="middle" class="svg-name">礼单</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 苏闻璟正面，礼单前景入画</text>
<text x="520" y="158" class="page-text">缓慢推近苏闻璟震惊表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏闻璟看着礼单，震惊得语速都慢了半拍，苏闻璟（对</text><text x="520" y="262" class="page-text">苏夫人与苏明舒讲话，情绪：震惊）：南海珠三斛，城</text><text x="520" y="292" class="page-text">南铺子两间，西郊温泉庄子，还有……</text>
</g><g transform="translate(54,1010)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">7-15｜太厚了些｜5秒</text>
<image href="../panels/ep7_panel_7-15.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#efe8dd" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 190 306 L 110 142 L 238 142 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="190" y1="306" x2="174" y2="184" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="172,320 208,320 190,284" fill="#356d9b"/><text x="190" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">苏明舒反应 / FOV</text><circle cx="172" cy="185" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="172" y="227" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="250" cy="220" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="250" y="262" text-anchor="middle" class="svg-name">青枝</text><circle cx="82" cy="132" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="82" y="174" text-anchor="middle" class="svg-name">谢临舟</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 苏明舒正面，礼单虚化在前景边缘</text>
<text x="520" y="158" class="page-text">轻微推近苏明舒犹豫表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒看着礼单，语气都迟疑了，苏明舒（对谢临舟讲</text><text x="520" y="262" class="page-text">话，情绪：惊讶）：谢大人，这聘礼……是不是太厚了</text><text x="520" y="292" class="page-text">些？</text>
</g><g transform="translate(54,1468)">
<rect x="0" y="0" width="960" height="386" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">7-16｜诚意不薄｜4秒</text>
<image href="../panels/ep7_panel_7-16.svg" x="26" y="62" width="170" height="302"/>
<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#efe8dd" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 184 306 L 114 90 L 242 90 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="184" y1="306" x2="178" y2="132" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="166,320 202,320 184,284" fill="#356d9b"/><text x="184" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">谢临舟正面 / FOV</text><circle cx="176" cy="130" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="176" y="172" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="246" cy="155" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="246" y="197" text-anchor="middle" class="svg-name">石墩</text><circle cx="95" cy="205" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="95" y="247" text-anchor="middle" class="svg-name">苏明舒</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 谢临舟正面平视</text>
<text x="520" y="158" class="page-text">极慢推近谢临舟冷静表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">谢临舟淡淡回答，谢临舟（对苏明舒讲话，情绪：认真</text><text x="520" y="262" class="page-text">）：不厚，怕你嫌我诚意薄。</text>
</g>
</svg>