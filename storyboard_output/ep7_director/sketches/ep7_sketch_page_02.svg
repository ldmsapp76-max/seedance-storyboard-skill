<g transform="translate(228,54) scale(0.72)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#efe8dd" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">苏府正厅 / 主轴线</text><path d="M 180 314 L 116 108 L 244 108 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="180" y1="314" x2="180" y2="150" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="162,328 198,328 180,292" fill="#356d9b"/><text x="180" y="352" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">正厅全轴 / FOV</text><circle cx="182" cy="104" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="182" y="146" text-anchor="middle" class="svg-name">谢临舟</text><circle cx="254" cy="132" r="22" fill="#8b7a68" stroke="#252525" stroke-width="2"/><text x="254" y="174" text-anchor="middle" class="svg-name">石墩</text><circle cx="88" cy="164" r="22" fill="#8b6d50" stroke="#252525" stroke-width="2"/><text x="88" y="206" text-anchor="middle" class="svg-name">苏闻璟</text><circle cx="82" cy="226" r="22" fill="#b98a8e" stroke="#252525" stroke-width="2"/><text x="82" y="268" text-anchor="middle" class="svg-name">苏夫人</text><circle cx="228" cy="236" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="228" y="278" text-anchor="middle" class="svg-name">苏明舒</text><circle cx="286" cy="260" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="286" y="302" text-anchor="middle" class="svg-name">青枝</text></g>
<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">双人中近景 / 苏明舒与谢临舟正侧面对峙同框</text>
<text x="520" y="158" class="page-text">固定镜头，靠台词包袱完成节奏</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒努力保持温柔，苏明舒（对谢临舟讲话，情绪：</text><text x="520" y="262" class="page-text">迟疑）：这是不是有些突然？谢临舟不紧不慢，谢临舟</text><text x="520" y="292" class="page-text">（对苏明舒讲话，情绪：冷淡）：比你把顾灵薇喷</text>
</g><g transform="translate(54,1468)">
