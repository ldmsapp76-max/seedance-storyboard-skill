<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">近景 / 苏闻璟正面，谢临舟在对面虚化</text>
<text x="520" y="158" class="page-text">缓慢推近苏闻璟沉稳表情</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏闻璟看向谢临舟，声音沉稳，苏闻璟（对谢临舟讲话</text><text x="520" y="262" class="page-text">，情绪：审视）：老夫想问一句，你求的是苏家嫡女，</text><text x="520" y="292" class="page-text">还是我女儿苏明舒？</text>
