<text x="520" y="92" class="page-label">导演备注</text>
<text x="520" y="126" class="page-text">中近景 / 苏明舒侧前方，谢临舟在对面</text>
<text x="520" y="158" class="page-text">缓慢推近苏明舒放下茶盏动作</text>
<text x="520" y="198" class="page-label">画面动作</text>
<text x="520" y="232" class="page-text">苏明舒放下茶盏，努力笑得温和，苏明舒（对谢临舟讲</text><text x="520" y="262" class="page-text">话，情绪：试探）：谢大人，我们今日才第一次见。谢</text><text x="520" y="292" class="page-text">临舟平静应声，谢临舟（对苏明舒讲话，情绪：平</text>
</g><g transform="translate(54,552)">
