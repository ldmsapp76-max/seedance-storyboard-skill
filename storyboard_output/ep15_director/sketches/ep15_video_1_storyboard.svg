<g transform="translate(260,76) scale(0.78)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#eee6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">谪仙馆后院 / 主轴线</text><path d="M 92 296 L 160 78 L 288 78 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="92" y1="296" x2="224" y2="120" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="74,310 110,310 92,274" fill="#356d9b"/><text x="92" y="334" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">檐下慢拉 / FOV</text><circle cx="230" cy="112" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="230" y="154" text-anchor="middle" class="svg-name">谢清越</text><rect x="231" y="138" width="26" height="20" rx="4" fill="#d8c49a" stroke="#252525" stroke-width="2"/><text x="244" y="180" text-anchor="middle" class="svg-name">折扇</text><path d="M 238 92 C 250 70, 272 58, 302 48" fill="none" stroke="#a75858" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arr)"/></g>
<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">檐下慢拉，衣角闪过，谢清越从阴影出场</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">门外檐下，一片衣角迅速闪过。谢清越突然打喷嚏，把</text><text x="560" y="266" class="page-text">折扇啪地合上，从阴影中走出，夕阳照亮侧脸。</text>
</g><g transform="translate(54,704)">
