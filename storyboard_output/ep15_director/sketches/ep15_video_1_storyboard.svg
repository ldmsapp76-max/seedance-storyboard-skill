<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">慢推林晚反应</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">林晚神色不咸不淡，平静回视谢清越，手中漫不经心摆</text><text x="560" y="266" class="page-text">弄竹匾里的药材。</text>
</g>
