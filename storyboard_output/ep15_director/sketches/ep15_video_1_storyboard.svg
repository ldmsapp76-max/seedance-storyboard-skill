<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">固定镜头，院内对峙</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">谢清越走到院内，双手交叉环抱，挑眉审视林晚。林晚</text><text x="560" y="266" class="page-text">停下整理药材，转身看他。</text>
</g><g transform="translate(54,1292)">
