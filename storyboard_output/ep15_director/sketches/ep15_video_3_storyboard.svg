<g transform="translate(260,76) scale(0.78)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#eee6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">城南旧仓 / 主轴线</text><path d="M 180 304 L 116 132 L 244 132 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="180" y1="304" x2="180" y2="174" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="162,318 198,318 180,282" fill="#356d9b"/><text x="180" y="342" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">回忆手持 / FOV</text><circle cx="178" cy="174" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="178" y="216" text-anchor="middle" class="svg-name">谢清越</text><rect x="167" y="202" width="26" height="20" rx="4" fill="#8a7d73" stroke="#252525" stroke-width="2"/><text x="180" y="244" text-anchor="middle" class="svg-name">死鼠尾</text></g>
<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">手持轻晃，闪白回忆</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">城南旧仓光线昏暗，粉尘飞扬。灰头土脸的谢清越从谷</text><text x="560" y="266" class="page-text">堆深处拽出死老鼠，嫌弃崩溃。</text>
</g><g transform="translate(54,1292)">
<rect x="0" y="0" width="960" height="500" rx="10" fill="#fffdf8" stroke="#cfc6ba" stroke-width="2"/>
<text x="26" y="42" class="page-title">15-2-3｜00:10-00:15｜近景</text>
<image href="../panels/ep15_panel_15-2-3.svg" x="26" y="72" width="200" height="356"/>
<g transform="translate(260,76) scale(0.78)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#eee6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">谪仙馆后院 / 主轴线</text><path d="M 142 306 L 78 146 L 206 146 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="142" y1="306" x2="142" y2="188" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="124,320 160,320 142,284" fill="#356d9b"/><text x="142" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">林晚反应 / FOV</text><circle cx="132" cy="200" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="132" y="242" text-anchor="middle" class="svg-name">林晚</text><circle cx="226" cy="162" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="226" y="204" text-anchor="middle" class="svg-name">谢清越</text><rect x="159" y="212" width="26" height="20" rx="4" fill="#8a7d73" stroke="#252525" stroke-width="2"/><text x="172" y="254" text-anchor="middle" class="svg-name">死鼠尾</text><rect x="235" y="186" width="26" height="20" rx="4" fill="#d8c49a" stroke="#252525" stroke-width="2"/><text x="248" y="228" text-anchor="middle" class="svg-name">折扇</text></g>
<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">固定，闪白回现实</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">后院月光下，林晚看着暴跳如雷的谢清越，不惧反笑，</text><text x="560" y="266" class="page-text">眉眼弯弯，开心俏皮。</text>
</g>
