<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">固定，拍肩结盟</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">谢清越瞬间变积极，连连点头。林晚站起身，笑着拍他</text><text x="560" y="266" class="page-text">肩膀。</text>
</g><g transform="translate(54,1292)">
