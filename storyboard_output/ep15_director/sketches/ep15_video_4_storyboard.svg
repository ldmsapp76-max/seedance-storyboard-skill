<g transform="translate(260,76) scale(0.78)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#eee6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">谪仙馆后院 / 主轴线</text><path d="M 182 312 L 118 134 L 246 134 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="182" y1="312" x2="182" y2="176" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="164,326 200,326 182,290" fill="#356d9b"/><text x="182" y="350" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">双人轴线 / FOV</text><circle cx="132" cy="200" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="132" y="242" text-anchor="middle" class="svg-name">林晚</text><circle cx="226" cy="162" r="22" fill="#586a83" stroke="#252525" stroke-width="2"/><text x="226" y="204" text-anchor="middle" class="svg-name">谢清越</text><rect x="159" y="212" width="26" height="20" rx="4" fill="#8a7d73" stroke="#252525" stroke-width="2"/><text x="172" y="254" text-anchor="middle" class="svg-name">死鼠尾</text><rect x="235" y="186" width="26" height="20" rx="4" fill="#d8c49a" stroke="#252525" stroke-width="2"/><text x="248" y="228" text-anchor="middle" class="svg-name">折扇</text></g>
<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">慢推谢清越气鼓鼓反应</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">谢清越瞪大眼，两腮微鼓，气鼓鼓但可爱。林晚歪头，</text><text x="560" y="266" class="page-text">调皮解释。</text>
