<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">慢拉，欢喜冤家互动</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">谢清越扬下巴恢复傲娇，右手猛烈摇折扇。林晚笑得开</text><text x="560" y="266" class="page-text">怀，伸手帮他顺背消气。</text>
</g>
