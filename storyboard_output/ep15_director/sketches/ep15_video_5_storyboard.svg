<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">固定，吹灭蜡烛</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">镜头聚焦林晚脸部与桌上蜡烛。林晚低头凑近烛火轻轻</text><text x="560" y="266" class="page-text">一吹，火焰熄灭，青烟升起，画面暗下。</text>
</g>
