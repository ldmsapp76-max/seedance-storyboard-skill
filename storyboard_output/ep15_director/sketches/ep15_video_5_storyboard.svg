<g transform="translate(260,76) scale(0.78)"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#356d9b"/></marker></defs><rect x="12" y="12" width="336" height="316" rx="10" fill="#fbfaf7" stroke="#cfc6ba"/><rect x="46" y="42" width="268" height="66" rx="8" fill="#eee6dc" stroke="#d7c9bb"/><text x="180" y="80" text-anchor="middle" class="svg-muted">林晚房间 / 主轴线</text><path d="M 142 306 L 78 146 L 206 146 Z" fill="#7aa0c4" opacity=".16" stroke="#356d9b" stroke-width="2"/><line x1="142" y1="306" x2="142" y2="188" stroke="#356d9b" stroke-width="4" marker-end="url(#arr)"/><polygon points="124,320 160,320 142,284" fill="#356d9b"/><text x="142" y="344" text-anchor="middle" class="svg-cam">CAM</text><text x="320" y="318" text-anchor="end" class="svg-muted">林晚反应 / FOV</text><circle cx="142" cy="190" r="22" fill="#d89b65" stroke="#252525" stroke-width="2"/><text x="142" y="232" text-anchor="middle" class="svg-name">林晚</text><circle cx="234" cy="165" r="22" fill="#78a06f" stroke="#252525" stroke-width="2"/><text x="234" y="207" text-anchor="middle" class="svg-name">阿云</text><rect x="163" y="212" width="26" height="20" rx="4" fill="#e3a847" stroke="#252525" stroke-width="2"/><text x="176" y="254" text-anchor="middle" class="svg-name">蜡烛</text></g>
<text x="560" y="120" class="page-label">导演备注</text>
<text x="560" y="154" class="page-text">慢推林晚下令</text>
<text x="560" y="202" class="page-label">画面动作</text>
<text x="560" y="236" class="page-text">林晚身体前倾，振奋地看向阿云下达指令。阿云重重点</text><text x="560" y="266" class="page-text">头，干劲十足。</text>
</g><g transform="translate(54,1292)">
